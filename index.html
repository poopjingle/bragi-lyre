<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDEFE9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101720">
<meta name="description" content="Daily lyre practice for offerings to Bragi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>Lyre Offerings to Bragi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,400;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a practice-room companion. One session per screen, the lyre's own 16 strings as the signature figure, a phone-style tab bar at the bottom. */
:root{
  --bg:#EDEFE9; --surface:#F9FAF6; --sunk:#E2E6DD; --ink:#1B2430; --muted:#56626A; --line:#CBD1C6;
  --brass:#946410; --brass-hi:#C08A26; --brass-soft:#F0E2C2; --on-brass:#FBF8EF;
  --fjord:#2B5870; --ok:#2B7549; --off:#AE5128;
  --f-display:"Alegreya","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Alegreya Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:62px; --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101720; --surface:#17202C; --sunk:#0C1218; --ink:#E8E3D5; --muted:#9BA5AF; --line:#2A3544;
    --brass:#DFAD4B; --brass-hi:#F1C66C; --brass-soft:#352B18; --on-brass:#16110A;
    --fjord:#8DBAD4; --ok:#5EC68D; --off:#EE9061; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101720; --surface:#17202C; --sunk:#0C1218; --ink:#E8E3D5; --muted:#9BA5AF; --line:#2A3544;
  --brass:#DFAD4B; --brass-hi:#F1C66C; --brass-soft:#352B18; --on-brass:#16110A;
  --fjord:#8DBAD4; --ok:#5EC68D; --off:#EE9061; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
a{color:var(--fjord)}
:focus-visible{outline:2px solid var(--fjord);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:10px 16px 10px;display:grid;gap:8px}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:19px;min-width:0}
.brand svg{flex:none;color:var(--brass)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.bar i{display:block;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--brass-hi);border-radius:3px}
.bar i.ph{margin-left:4px}

/* layout */
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:22px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{appearance:none;background:none;border:0;color:var(--muted);font:500 12.5px/1 var(--f-ui);letter-spacing:.03em;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--brass)}
.tabs button[aria-current="page"] svg{stroke-width:2}

/* session */
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dchip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px 0}
.dchip .n{font:700 17px/1 var(--f-display);font-variant-numeric:tabular-nums}
.dchip .w{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.dchip.done{background:var(--brass-soft);border-color:transparent}
.dchip.done .n{color:var(--brass)}
.dchip.here{border:2px solid var(--ink)}
.dchip.next .w{color:var(--brass)}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass)}
.badge.ok{background:transparent;border:1px solid var(--brass)}
.head{display:grid;gap:8px}
.dtitle{font-size:clamp(30px,8vw,40px);font-weight:700}
.goal{margin:0;color:var(--muted);max-width:62ch}
.goal b{color:var(--ink);font-weight:500}
.blocks{display:grid}
.blk{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:6px}
.blk:last-child{border-bottom:1px solid var(--line)}
.lab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.lab .t{color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:13.5px;font-variant-numeric:tabular-nums}
.blk p{margin:0}
.tune-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.ghost{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ghost svg{color:var(--brass)}
ol.steps{margin:2px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;max-width:64ch}
ol.steps li::before{content:counter(s);font:700 19px/1.35 var(--f-display);color:var(--brass);font-variant-numeric:tabular-nums}
h2.sec{font-size:22px}
.links{display:grid;gap:10px}
.links h3{font:700 12.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.lk{display:grid;grid-template-columns:64px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:inherit;min-height:60px}
.lk:hover{border-color:var(--fjord)}
.kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fjord);border:1px solid currentColor;border-radius:5px;padding:4px 0;text-align:center}
.lk .tt{font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.lk .src{font-size:14px;color:var(--muted)}
.lk svg{color:var(--muted)}
.poem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:12px}
.poem header{display:grid;gap:2px}
.poem header h3{font-size:22px}
.poem header p{margin:0;font-size:14px;color:var(--muted)}
.pl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.pl .ln{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px}
.pl .on{font:italic 500 20px/1.3 var(--f-display)}
.pl .en{grid-column:2;font-size:15px;color:var(--muted)}
.pl .ch{grid-row:1 / span 2;grid-column:3;text-align:right;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;padding-top:4px}
.pl .ch small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.dr{grid-column:2 / span 2;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-top:4px}
.dr::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brass-hi)}
.poem .legend{font-size:14px;color:var(--muted);margin:0}
figure.str{margin:0;display:grid;gap:8px}
figure.str svg{width:100%;height:auto;display:block;max-width:100%}
figure.str figcaption{font-size:15px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:18px;height:3px;border-radius:2px}
svg text{font-family:var(--f-ui)}
.offer{background:var(--brass-soft);border-radius:16px;padding:18px;display:grid;gap:6px}
.offer .lab{color:var(--brass)}
.offer p{margin:0}
.offer .what{font:italic 500 21px/1.35 var(--f-display)}
.offer .sub{font-size:15px;color:var(--muted)}
.actions{display:grid;gap:10px}
.primary{appearance:none;border:0;border-radius:14px;background:var(--brass);color:var(--on-brass);font-weight:700;font-size:17px;min-height:54px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.donebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--brass);border-radius:14px}
.donebar strong{color:var(--brass)}
.textbtn{appearance:none;background:none;border:0;color:var(--fjord);font-weight:500;cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.saved{font-size:13.5px;color:var(--muted);text-align:center;margin:0}
.pager{display:flex;justify-content:space-between;gap:10px}
.pager button{appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 2px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.pager button:disabled{opacity:.35;cursor:default}

/* plan */
.phase{display:grid;gap:12px}
.phase>header{display:grid;gap:4px}
.phase>header .pn{font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--brass)}
.phase>header h2{font-size:24px}
.phase>header p{margin:0;color:var(--muted);font-size:15.5px}
.wk{display:grid;gap:7px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.wk .wt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wk .wt b{font-weight:500}
.wk .wt span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cell{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;height:34px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);position:relative}
.cell.done{background:var(--brass-hi);border-color:transparent;color:var(--on-brass);font-weight:700}
.cell.next{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.cell.o::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;transform:rotate(45deg);background:currentColor;opacity:.7}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px}
.note h2{font-size:20px}
.note p{margin:0;font-size:15.5px;color:var(--muted)}
.bk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bk code{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere;min-width:0;flex:1 1 220px;user-select:all}
.bk input{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.msg{font-size:14px;color:var(--muted);margin:0;min-height:1.2em}

/* lyre reference */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums;width:3.5em}
td.nt{font-family:var(--f-display);font-weight:700;width:4em}
tr.hl td.nt{color:var(--brass)}

/* tuner */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;border-radius:999px;min-height:40px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.readout{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:grid;gap:6px;justify-items:center;text-align:center}
.readout .big{font:700 56px/1 var(--f-display);font-variant-numeric:tabular-nums;min-height:56px}
.readout .sub{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.5em}
.readout .st{font-weight:700;font-size:17px;min-height:1.5em}
.st.ok{color:var(--ok)} .st.off{color:var(--off)}
.gauge{width:100%;max-width:340px;height:auto;display:block}
.needle{transition:transform .12s linear;transform-origin:170px 150px}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:58px;cursor:pointer;display:grid;place-items:center;align-content:center;gap:1px;position:relative;padding:4px}
.sbtn .sn{font-size:11.5px;color:var(--muted);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.sbtn .nn{font:700 20px/1 var(--f-display)}
.sbtn.sel{border:2px solid var(--brass)}
.sbtn.playing{background:var(--brass);color:var(--on-brass);border-color:transparent}
.sbtn.playing .sn{color:var(--on-brass)}
.sbtn.tuned::after{content:"";position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tool-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.switch{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 8px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-weight:500;font-size:15px}
.switch i{width:34px;height:20px;border-radius:999px;background:var(--sunk);position:relative;transition:background .15s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-pressed="true"] i{background:var(--brass-soft)}
.switch[aria-pressed="true"] i::after{transform:translateX(14px);background:var(--brass)}
.howto{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15.5px;color:var(--muted)}
.howto b{color:var(--ink);font-weight:500}
.err{color:var(--off);font-size:15px;margin:0}
@media (prefers-reduced-motion: reduce){.needle,.switch i,.switch i::after{transition:none}}
@media (min-width:640px){.links .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.grid2{display:grid;gap:10px}
</style>

<header class="top">
  <div class="in">
    <div class="row">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 3.5c-2.2 3-2.2 8.5 1 12.5 1.4 1.8 3 2.8 5 2.8s3.6-1 5-2.8c3.2-4 3.2-9.5 1-12.5"/><path d="M5 6.2h14"/><path d="M9.6 6.2v11.4M12 6.2v12.6M14.4 6.2v11.4"/></svg>
        <span>Lyre Offerings to Bragi</span>
      </div>
      <div class="count" id="count">0 of 84 done</div>
    </div>
    <div class="bar" id="bar" aria-hidden="true"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-session" aria-label="Session"></section>
  <section class="view" id="v-tuner" aria-label="Tuner" hidden></section>
  <section class="view" id="v-plan" aria-label="Plan" hidden></section>
  <section class="view" id="v-lyre" aria-label="Lyre" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" id="t-session" data-tab="session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6.5v13"/></svg>Session</button>
    <button type="button" id="t-tuner" data-tab="tuner">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8.5 2.5v8a3.5 3.5 0 0 0 7 0v-8"/><path d="M12 14v7.5"/></svg>Tuner</button>
    <button type="button" id="t-plan" data-tab="plan">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.8h17M9.2 4v16M14.8 4v16"/></svg>Plan</button>
    <button type="button" id="t-lyre" data-tab="lyre">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 3.5c-2.2 3-2.2 8.5 1 12.5 1.4 1.8 3 2.8 5 2.8s3.6-1 5-2.8c3.2-4 3.2-9.5 1-12.5"/><path d="M5 6.2h14"/><path d="M9.6 6.2v11.4M12 6.2v12.6M14.4 6.2v11.4"/></svg>Lyre</button>
  </div>
</nav>

<script>

"use strict";

/* ---------- the instrument ---------- */
var STR = [

  ["B4",493.88,""],
  ["C5",523.25,"Chant lift on Bragi's name"],

  ["F5",698.46,"Retune up to F sharp for G major songs"],
  ["G5",783.99,""],
  ["A5",880.00,"Highest string"]
];

/* ---------- links ---------- */
var LINKS = {
  hold:{k:"Search",t:"How to hold a lyre harp",s:"YouTube search",u:"https://www.youtube.com/results?search_query=how+to+hold+a+lyre+harp"},
  tune:{k:"Search",t:"Tuning a 16-string lyre harp",s:"YouTube search",u:"https://www.youtube.com/results?search_query=how+to+tune+16+string+lyre+harp"},
  damp:{k:"Search",t:"Damping technique for harp beginners",s:"YouTube search",u:"https://www.youtube.com/results?search_query=harp+damping+technique+beginner"},
  king:{k:"Read",t:"How to Play the Lyre",s:"Michael J. King",u:"https://www.michaeljking.com/how_to_play_the_lyre.htm"},

function loadLocal(){
  try{var j=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(j&&j.done&&typeof j.done==="object"){state.done=j.done;state.localOnly=!!j.localOnly;}}catch(e){}
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({done:state.done,localOnly:state.localOnly}));}catch(e){}}

function syncText(){
  if(sync.mode==="account")return "Progress saves to your Claude account and syncs across your devices.";
  if(sync.mode==="connecting")return "Connecting to your account. Progress is kept on this device meanwhile.";
  return "Progress saves on this device.";
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function initSync(){
  if(!HAS_CLAUDE){setSync("device");return;}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user){setSync("device");return null;}
    return user.id().then(function(uid){
      if(!uid){setSync("device");return;}
      var ref;
      try{ref=db.doc("data/users/"+uid+"/progress");}catch(e){setSync("device");return;}
      sync.ref=ref;
      var first=true;
      ref.onSnapshot(function(snap){
        if(sync.writing||sync.dirty){first=false;return;}
        var body=snap.exists?(snap.data()||{}):{};
        var server=(body.done&&typeof body.done==="object")?body.done:{};
        if(first){
          first=false;
          if(state.localOnly){
            var merged={};var k;
            for(k in server)merged[k]=server[k];
            for(k in state.done)merged[k]=state.done[k];
            state.done=merged;state.localOnly=false;saveLocal();setSync("account");
            if(Object.keys(merged).length!==Object.keys(server).length)queueWrite();
            afterData();return;
          }
        }
        var copy={};for(var k2 in server)copy[k2]=server[k2];
        state.done=copy;saveLocal();setSync("account");afterData();
      },function(){sync.ref=null;setSync("device");});
    });
  }).catch(function(){setSync("device");});
}
function afterData(){
  if(!state.userNav)state.view=nextIndex();
  renderChrome();
  if(state.tab==="session")renderSession();
  if(state.tab==="plan")renderPlan();
}
function queueWrite(){
  if(!sync.ref){state.localOnly=true;saveLocal();return;}
  sync.dirty=true;
  if(!sync.writing)flush();
}
function flush(){
  sync.writing=true;
  (async function(){
    while(sync.dirty){
      sync.dirty=false;
      var body={done:Object.assign({},state.done),updated:new Date().toISOString()};
      try{await sync.ref.set(body);}
      catch(e){
        if(e&&e.code==="unavailable"){
          await sleep(700+Math.random()*900);
          try{await sync.ref.set(body);}catch(e2){state.localOnly=true;saveLocal();setSync("device");break;}
        }else{state.localOnly=true;saveLocal();setSync("device");break;}
      }
    }
    sync.writing=false;
  })();
}

  for(var j=0;j<21;j++){var n=parseInt(hex[j],16);for(var b=0;b<4;b++){var i=j*4+b;if(i<TOTAL&&(n&(1<<b))){var f=from(i),k=key(f.w,f.d);if(!state.done[k]){state.done[k]=t;added++;}}}}

/* ---------- audio ---------- */
var AC=null,master=null,pluckWave=null,holdWave=null;
function audio(){
  if(!AC){
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    AC=new C();master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
    var n=14,re=new Float32Array(n),im=new Float32Array(n);
    for(var k=1;k<n;k++)im[k]=1/Math.pow(k,1.25);
    pluckWave=AC.createPeriodicWave(re,im);
    var im2=new Float32Array(n);im2[1]=1;im2[2]=0.35;im2[3]=0.15;im2[4]=0.06;
    holdWave=AC.createPeriodicWave(re,im2);
  }
  if(AC.state==="suspended")AC.resume();
  return AC;
}
function pluck(freq){
  var ctx=audio();if(!ctx)return;
  var t=ctx.currentTime,o=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
  o.setPeriodicWave(pluckWave);o.frequency.value=freq;
  lp.type="lowpass";lp.Q.value=0.7;lp.frequency.setValueAtTime(Math.min(freq*9,16000),t);lp.frequency.exponentialRampToValueAtTime(freq*1.6,t+1.8);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.32,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+3.2);
  o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+3.3);
}
var held=null;
function holdStart(i){
  holdStop();var ctx=audio();if(!ctx)return;
  var t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.setPeriodicWave(holdWave);o.frequency.value=STR[i-1][1];
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.08);
  o.connect(g);g.connect(master);o.start(t);held={o:o,g:g,i:i};
}
function holdStop(){
  if(!held||!AC)return;var t=AC.currentTime;
  try{held.g.gain.cancelScheduledValues(t);held.g.gain.setValueAtTime(Math.max(held.g.gain.value,0.0001),t);held.g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);held.o.stop(t+0.15);}catch(e){}
  held=null;
}

/* ---------- pitch detection (YIN) ---------- */
function yin(buf,sr){
  var N=buf.length,half=N>>1,minTau=Math.max(2,Math.floor(sr/1100)),maxTau=Math.min(half-1,Math.ceil(sr/150));
  var d=new Float32Array(maxTau+2),c=new Float32Array(maxTau+2);
  for(var tau=1;tau<=maxTau+1;tau++){var s=0;for(var i=0;i<half;i++){var x=buf[i]-buf[i+tau];s+=x*x;}d[tau]=s;}
  c[0]=1;var run=0;
  for(tau=1;tau<=maxTau+1;tau++){run+=d[tau];c[tau]=run>0?d[tau]*tau/run:1;}
  var best=-1;
  for(tau=minTau;tau<=maxTau;tau++){if(c[tau]<0.15){while(tau+1<=maxTau&&c[tau+1]<c[tau])tau++;best=tau;break;}}
  if(best<0)return null;
  var a=c[best-1],b=c[best],e=c[best+1],den=a+e-2*b;
  var tt=den!==0?best+(a-e)/(2*den):best;
  return {freq:sr/tt,clarity:1-b};
}
var NAMES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
function chromName(f){var m=Math.round(69+12*Math.log2(f/440));return NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);}
function centsOf(f,ref){return 1200*Math.log2(f/ref);}

/* ---------- tuner ---------- */
var MIC_OK=!HAS_CLAUDE&&!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
var tuner={mode:MIC_OK?"mic":"ref",hold:false,sel:0,tuned:{},playing:0,on:false,stream:null,an:null,buf:null,raf:0,last:0,hist:[],inSince:0,inTarget:0,wake:null,err:""};

function gaugeSVG(){
  var s='<svg class="gauge" viewBox="0 0 340 170" aria-hidden="true">';
  function pt(cents,r){var a=(cents/50)*60*Math.PI/180;return [170+r*Math.sin(a),150-r*Math.cos(a)];}
  var p1=pt(-5,118),p2=pt(5,118);
  s+='<path d="M'+pt(-50,118).join(" ")+' A118 118 0 0 1 '+pt(50,118).join(" ")+'" fill="none" stroke="var(--sunk)" stroke-width="14" stroke-linecap="round"/>';
  s+='<path d="M'+p1.join(" ")+' A118 118 0 0 1 '+p2.join(" ")+'" fill="none" stroke="var(--ok)" stroke-width="14"/>';
  for(var c=-50;c<=50;c+=10){var a=pt(c,100),b=pt(c,c%50===0?86:92);s+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="var(--muted)" stroke-width="1.5"/>';}
  var l=pt(-50,70),r=pt(50,70);
  s+='<text x="'+l[0]+'" y="'+(l[1]+4)+'" font-size="12" fill="var(--muted)" text-anchor="middle">Flat</text><text x="'+r[0]+'" y="'+(r[1]+4)+'" font-size="12" fill="var(--muted)" text-anchor="middle">Sharp</text>';
  s+='<g class="needle" id="needle"><line x1="170" y1="150" x2="170" y2="40" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/></g><circle cx="170" cy="150" r="7" fill="var(--brass)"/>';
  return s+'</svg>';
}
function renderTuner(){
  var v=$("v-tuner"),h='<div class="head"><div class="eyebrow"><span>Standard pitch, A = 440</span></div><h1 class="dtitle">Tuner</h1></div>';
  if(MIC_OK){
    h+='<div class="seg" role="group" aria-label="Tuner mode"><button type="button" id="m-mic" aria-pressed="'+(tuner.mode==="mic")+'">Microphone</button><button type="button" id="m-ref" aria-pressed="'+(tuner.mode==="ref")+'">Reference tones</button></div>';
  }
  if(tuner.mode==="mic"){
    h+='<div class="readout"><div class="big" id="r-note">'+(tuner.on?"·":"")+'</div><div class="sub" id="r-sub">'+(tuner.on?"Pluck one string and let it ring.":"Tap Start, then pluck a string.")+'</div>'+gaugeSVG()+'<div class="st" id="r-st"></div>';
    h+='<button type="button" class="primary" id="micbtn" style="width:100%">'+(tuner.on?"Stop tuner":"Start tuner")+'</button>';
    if(tuner.err)h+='<p class="err">'+esc(tuner.err)+'</p>';
    h+='</div>';
    h+='<div class="tool-row"><span class="count" id="tcount"></span><button type="button" class="textbtn" id="treset">Reset checklist</button></div>';
  }else{
    h+='<div class="tool-row"><button type="button" class="switch" id="holdbtn" aria-pressed="'+tuner.hold+'"><i></i>Hold tone</button><span class="count">Tap a string to hear it</span></div>';
  }
  h+='<div class="sgrid" id="sgrid"></div>';
  h+='<figure class="str" id="tfig"></figure>';
  if(tuner.mode==="mic"){
    h+='<ol class="howto"><li>Pluck <b>one string</b> at a time and let it ring.</li><li>The tuner follows the nearest string. If a string is far off, <b>tap it below</b> so the tuner locks onto it; tap again to unlock.</li><li><b>Tighten</b> the pin to raise the pitch, <b>loosen</b> it to lower. Small turns.</li><li>A green dot means the string held in tune for a moment.</li></ol>';
  }else{
    h+='<ol class="howto"><li>Tap a string to hear its target note, then pluck your own string.</li><li>If the two sounds <b>wobble</b> against each other, you are close. Turn the pin slowly until the wobble stops.</li><li><b>Tightening raises</b> the pitch. Turn Hold tone on to keep a note sounding while you tune with both hands.</li></ol>';
    if(HAS_CLAUDE)h+='<p class="goal">A needle tuner that listens through your microphone is in the installed Android version.</p>';
  }
  v.innerHTML=h;
  if(MIC_OK){
    $("m-mic").onclick=function(){if(tuner.mode!=="mic"){holdStop();tuner.playing=0;tuner.mode="mic";renderTuner();}};
    $("m-ref").onclick=function(){if(tuner.mode!=="ref"){micStop();tuner.mode="ref";tuner.sel=0;renderTuner();}};
  }
  if(tuner.mode==="mic"){
    $("micbtn").onclick=function(){if(tuner.on){micStop();renderTuner();}else micStart();};
    $("treset").onclick=function(){tuner.tuned={};drawStrings();};
  }else{
    $("holdbtn").onclick=function(){tuner.hold=!tuner.hold;if(!tuner.hold){holdStop();tuner.playing=0;}this.setAttribute("aria-pressed",String(tuner.hold));drawStrings();};
  }
  drawStrings();
}
function drawStrings(){
  var g=$("sgrid");if(!g)return;var h="";
  for(var i=1;i<=16;i++){
    var cl="sbtn"+(tuner.sel===i?" sel":"")+(tuner.playing===i?" playing":"")+(tuner.mode==="mic"&&tuner.tuned[i]?" tuned":"");
    var lab="String "+i+", "+STR[i-1][0]+(tuner.mode==="mic"?(tuner.sel===i?", locked":"")+(tuner.tuned[i]?", in tune":""):"");
    h+='<button type="button" class="'+cl+'" data-s="'+i+'" aria-label="'+lab+'"'+(tuner.mode==="mic"?' aria-pressed="'+(tuner.sel===i)+'"':'')+'><span class="sn">'+i+'</span><span class="nn">'+STR[i-1][0]+'</span></button>';
  }
  g.innerHTML=h;
  var fig=$("tfig");
  if(fig)fig.innerHTML=stringsSVG({sel:tuner.mode==="mic"?tuner.sel:0,active:tuner.playing,tuned:tuner.mode==="mic"?tuner.tuned:{},label:"String status"});
  var tc=$("tcount");if(tc){var n=Object.keys(tuner.tuned).length;tc.textContent=n+" of 16 strings in tune";}
}
function onStringTap(i){
  if(tuner.mode==="mic"){tuner.sel=(tuner.sel===i?0:i);tuner.hist=[];drawStrings();return;}
  if(tuner.hold){
    if(tuner.playing===i){holdStop();tuner.playing=0;}else{holdStart(i);tuner.playing=i;}
    drawStrings();return;
  }
  pluck(STR[i-1][1]);tuner.playing=i;drawStrings();
  var me=i;setTimeout(function(){if(tuner.playing===me&&!tuner.hold){tuner.playing=0;drawStrings();}},900);
}
function micStart(){
  tuner.err="";
  var ctx=audio();if(!ctx){tuner.err="This browser can't process audio.";renderTuner();return;}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
    var src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=4096;src.connect(an);
    tuner.stream=stream;tuner.an=an;tuner.src=src;tuner.buf=new Float32Array(an.fftSize);tuner.on=true;tuner.hist=[];
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){tuner.wake=l;},function(){});}catch(e){}
    renderTuner();tuner.raf=requestAnimationFrame(micLoop);
  },function(e){
    tuner.err=(e&&e.name==="NotAllowedError")?"Microphone access was refused. Allow it for this app in Chrome's site settings, then tap Start again.":"The microphone couldn't start. Check that no other app is using it, then try again.";
    renderTuner();
  });
}
function micStop(){
  if(tuner.raf)cancelAnimationFrame(tuner.raf);tuner.raf=0;
  if(tuner.stream){tuner.stream.getTracks().forEach(function(t){t.stop();});}
  try{if(tuner.src)tuner.src.disconnect();}catch(e){}
  tuner.stream=null;tuner.an=null;tuner.src=null;tuner.on=false;
  try{if(tuner.wake)tuner.wake.release();}catch(e){}tuner.wake=null;
}
function tunerLeave(){micStop();holdStop();tuner.playing=0;}
function median(a){var b=a.slice().sort(function(x,y){return x-y;});return b[b.length>>1];}
function micLoop(ts){
  tuner.raf=requestAnimationFrame(micLoop);
  if(ts-tuner.last<40)return;tuner.last=ts;
  var an=tuner.an;if(!an)return;
  an.getFloatTimeDomainData(tuner.buf);
  var rms=0;for(var i=0;i<tuner.buf.length;i++)rms+=tuner.buf[i]*tuner.buf[i];rms=Math.sqrt(rms/tuner.buf.length);
  if(rms<0.006){tuner.inSince=0;quiet();return;}
  var r=yin(tuner.buf,AC.sampleRate);
  if(!r||r.clarity<0.8||r.freq<150||r.freq>1100)return;
  if(tuner.hist.length&&Math.abs(centsOf(r.freq,median(tuner.hist)))>80)tuner.hist=[];
  tuner.hist.push(r.freq);if(tuner.hist.length>5)tuner.hist.shift();
  showPitch(median(tuner.hist));
}
var quietTimer=0;
function quiet(){
  if(quietTimer)return;
  quietTimer=setTimeout(function(){quietTimer=0;var st=$("r-st");if(st&&tuner.on&&tuner.an){var a=tuner.buf,rms=0;for(var i=0;i<a.length;i++)rms+=a[i]*a[i];if(Math.sqrt(rms/a.length)<0.006){st.textContent="";st.className="st";}}},900);
}
function showPitch(f){
  var target=tuner.sel,best=1e9;
  if(!target){for(var i=1;i<=16;i++){var c=Math.abs(centsOf(f,STR[i-1][1]));if(c<best){best=c;target=i;}}}
  var cents=centsOf(f,STR[target-1][1]);
  var note=$("r-note"),sub=$("r-sub"),st=$("r-st"),nd=$("needle");if(!note)return;
  var far=!tuner.sel&&Math.abs(cents)>100;
  note.textContent=far?chromName(f):STR[target-1][0];
  sub.textContent=far?(f.toFixed(1)+" Hz, not near a lyre string. Tap the string you are tuning."):("String "+target+" · "+f.toFixed(1)+" Hz · "+(cents>=0?"+":"−")+Math.abs(cents).toFixed(0)+" cents");
  var clamp=Math.max(-50,Math.min(50,cents));
  if(nd)nd.style.transform="rotate("+((clamp/50)*60).toFixed(1)+"deg)";
  if(far){st.textContent="";st.className="st";return;}
  if(Math.abs(cents)<=5){
    st.textContent="In tune";st.className="st ok";
    var now=performance.now();
    if(tuner.inTarget!==target){tuner.inTarget=target;tuner.inSince=now;}
    else if(now-tuner.inSince>700&&!tuner.tuned[target]){tuner.tuned[target]=true;drawStrings();}
  }else{
    tuner.inSince=0;tuner.inTarget=0;
    st.textContent=cents<0?"Flat: tighten a little":"Sharp: loosen a little";st.className="st off";
  }
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-go],[data-tab],[data-s]"):null;if(!t)return;
  if(t.hasAttribute("data-s")){onStringTap(+t.getAttribute("data-s"));return;}
  if(t.hasAttribute("data-tab")){setTab(t.getAttribute("data-tab"));return;}
  if(t.hasAttribute("data-go")&&!t.disabled){go(+t.getAttribute("data-go"));}
});
document.addEventListener("visibilitychange",function(){if(document.hidden){tunerLeave();if(state.tab==="tuner")renderTuner();}});

/* ---------- boot ---------- */
function parseHash(){
  var h=(location.hash||"").replace(/^#/,"");
  var m=/^w(\d{1,2})d(\d)$/.exec(h);
  if(m){var w=+m[1],d=+m[2];if(w>=1&&w<=12&&d>=1&&d<=7){state.view=idx(w,d);state.userNav=true;return "session";}}
  if(h==="tuner"||h==="plan"||h==="lyre")return h;
  return null;
}
function start(data){
  loadLocal();
  state.view=nextIndex();
  var tab=parseHash()||"session";
  if(data&&typeof data.view==="number"){state.view=data.view;state.userNav=true;if(data.tab)tab=data.tab;}
  renderChrome();setTab(tab,false);
  initSync();
}
var hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(function(){return {view:state.view,tab:state.tab};});}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>

<script>
if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
